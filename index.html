<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OPD Campaign CRM</title>
<style>
*{box-sizing:border-box}
:root{
  --navy:#12264a;
  --navy-2:#19335e;
  --teal:#21a89b;
  --teal-dark:#138f86;
  --teal-soft:#e9f8f6;
  --text:#1d2b45;
  --muted:#65748d;
  --border:#d8e1ec;
  --bg:#f4f8fa;
  --white:#fff;
  --shadow:0 24px 70px rgba(18,38,74,.10);
}
html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.center{min-height:100vh;display:grid;place-items:center;padding:0}
.screen{min-height:100vh}
.login-card{
  width:min(440px,calc(100vw - 34px));
  background:rgba(255,255,255,.96);
  border:1px solid rgba(255,255,255,.8);
  border-radius:24px;
  padding:38px;
  box-shadow:var(--shadow);
  backdrop-filter:blur(12px);
}
.login-card:before{
  content:"";
  display:block;
  width:52px;
  height:52px;
  border-radius:16px;
  margin-bottom:20px;
  background:linear-gradient(135deg,#2bb8aa,#0c8f86);
  box-shadow:0 10px 22px rgba(33,168,155,.20);
}
.brand{
  font-size:22px;
  font-weight:800;
  letter-spacing:-.5px;
  margin-bottom:8px;
  color:var(--navy);
}
.brand span{color:var(--teal)}
.login-card h1{
  font-size:30px;
  line-height:1.15;
  letter-spacing:-.7px;
  margin:12px 0 7px;
  color:var(--navy);
}
.login-card form{display:grid;gap:16px;margin-top:25px}
label{display:grid;gap:7px;font-size:13px;font-weight:650;color:var(--navy)}
input,select,textarea{
  width:100%;
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px 13px;
  background:#fff;
  color:var(--text);
  transition:border-color .18s,box-shadow .18s,transform .18s;
}
input::placeholder,textarea::placeholder{color:#96a3b5}
input:focus,select:focus,textarea:focus{
  outline:0;
  border-color:#75c9c1;
  box-shadow:0 0 0 4px rgba(33,168,155,.11);
}
textarea{min-height:90px}
.btn{
  border:0;
  border-radius:11px;
  padding:11px 15px;
  font-weight:700;
  transition:transform .12s,box-shadow .12s,background .12s;
}
.btn:disabled{opacity:.62;cursor:not-allowed;transform:none!important}
[data-loading="true"]{cursor:progress}

.btn:hover{transform:translateY(-1px)}
.btn.primary{
  background:linear-gradient(135deg,var(--teal),var(--teal-dark));
  color:#fff;
  box-shadow:0 10px 24px rgba(33,168,155,.20);
}
.btn.primary:hover{box-shadow:0 14px 28px rgba(33,168,155,.26)}
.btn.secondary{background:#edf3f7;color:#334b68}
.btn.ghost{background:transparent;color:#cbd5e1;border:1px solid #33445e}
.error{min-height:18px;color:#b91c1c;font-size:12px}
.muted{color:var(--muted)}
.small{font-size:12px}
.full{width:100%}

#loginView{
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 72% 7%,rgba(88,201,190,.15),transparent 26%),
    radial-gradient(circle at 7% 90%,rgba(93,137,218,.11),transparent 25%),
    linear-gradient(135deg,#f8fcfd 0%,#eef6f8 100%);
}
#loginView:after{
  content:"";
  position:absolute;
  left:50%;
  bottom:-140px;
  width:620px;
  height:270px;
  border-radius:50% 50% 0 0;
  background:linear-gradient(135deg,rgba(42,183,171,.78),rgba(24,151,141,.93));
  transform:translateX(-20%) rotate(-11deg);
  opacity:.80;
}
#loginView .login-card{position:relative;z-index:2}

#app{min-height:100vh;display:flex;background:#f4f7fa}
aside{
  position:fixed;
  inset:0 auto 0 0;
  width:248px;
  background:linear-gradient(180deg,#102343 0%,#0d1d37 100%);
  color:#fff;
  padding:22px 15px;
  display:flex;
  flex-direction:column;
  box-shadow:10px 0 34px rgba(18,38,74,.08);
}
aside .brand{padding:4px 10px 22px;color:#fff}
aside .brand:after{
  content:"Campaign lead management";
  display:block;
  color:#8292aa;
  font-size:10px;
  font-weight:500;
  letter-spacing:.2px;
  margin-top:5px;
}
aside .brand span{color:#43c4b6}
nav{display:grid;gap:5px}
nav button{
  background:transparent;
  border:0;
  color:#b9c6d9;
  text-align:left;
  padding:12px 13px;
  border-radius:10px;
  font-size:13px;
  font-weight:600;
}
nav button.active,nav button:hover{background:rgba(255,255,255,.08);color:#fff}
nav button.active{box-shadow:inset 3px 0 0 #39b9ae}
.bottom{
  margin-top:auto;
  display:grid;
  gap:10px;
  font-size:12px;
  color:#cbd5e1;
  padding:10px;
}
main{margin-left:248px;width:calc(100% - 248px)}
header{
  height:76px;
  background:rgba(255,255,255,.92);
  border-bottom:1px solid #e6ebf0;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 30px;
  position:sticky;
  top:0;
  z-index:10;
  backdrop-filter:blur(10px);
}
.page-title{font-size:21px;font-weight:800;color:var(--navy);letter-spacing:-.3px}
.content,section#content{padding:28px}
.grid{display:grid;gap:17px}
.metrics{grid-template-columns:repeat(4,1fr)}
.two{grid-template-columns:repeat(2,1fr)}
.card,.panel{
  background:rgba(255,255,255,.94);
  border:1px solid #e5eaf0;
  border-radius:16px;
  box-shadow:0 8px 24px rgba(15,23,42,.04);
}
.card{padding:20px}
.panel{padding:20px;margin-top:18px}
.metric-label{font-size:12px;color:#748196;font-weight:650}
.metric{font-size:30px;font-weight:850;margin-top:6px;color:var(--navy)}
.panel-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px
}
.section-title{margin:0;font-size:16px;color:var(--navy)}
.filters{display:flex;gap:9px;flex-wrap:wrap}
.filters>*{width:auto;min-width:150px}
.filters.lead-filters{
  display:grid;
  grid-template-columns:minmax(220px,1.6fr) minmax(180px,1.2fr) minmax(160px,1fr) minmax(150px,.9fr) minmax(150px,.9fr);
  gap:14px;
  align-items:end;
}
.filters.lead-filters > *{width:100%;min-width:0}
.filters.lead-filters label{font-size:12px}
.filters.lead-filters .filter-group{
  display:grid;
  gap:7px;
  min-width:0;
}
.filters.lead-filters .filter-label{
  font-size:12px;
  font-weight:700;
  color:var(--navy);
}
.filters.lead-filters .date-group{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  grid-column:span 2;
}
.filters.lead-filters .section-break{
  grid-column:1/-1;
  border-top:1px solid #edf1f4;
  margin-top:2px;
  padding-top:2px;
}
@media(max-width:1200px){
  .filters.lead-filters{grid-template-columns:repeat(3,1fr)}
  .filters.lead-filters .date-group{grid-column:span 2}
}
@media(max-width:760px){
  .filters.lead-filters{grid-template-columns:1fr}
  .filters.lead-filters .date-group{grid-column:auto;grid-template-columns:1fr}
}

.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:12px 10px;text-align:left;border-bottom:1px solid #edf1f4;white-space:nowrap}
th{color:#738198;background:#fafbfd;font-weight:700}
tr:hover td{background:#fcfefe}
.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#edf2ff;color:#3f46a4;font-size:11px;font-weight:700}
.success{background:#eaf9f6;color:#087a6f}
.warn{background:#fff5e9;color:#b75f0c}
.danger{background:#fff0f2;color:#b42335}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.notice{
  padding:13px 15px;
  border-radius:11px;
  background:#edf9f7;
  color:#087d73;
  font-size:13px;
  border:1px solid #d4f0ec;
}
.modal{
  position:fixed;
  inset:0;
  background:rgba(10,25,47,.54);
  display:grid;
  place-items:center;
  padding:20px;
  z-index:20;
  backdrop-filter:blur(3px);
}
.modal-box{
  background:#fff;
  width:min(780px,100%);
  max-height:90vh;
  overflow:auto;
  border-radius:18px;
  padding:24px;
  box-shadow:0 30px 80px rgba(12,30,58,.22)
}
.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}
.toast{
  position:fixed;
  right:22px;
  bottom:22px;
  background:#11233f;
  color:#fff;
  padding:12px 16px;
  border-radius:10px;
  display:none;
  z-index:30;
  box-shadow:0 12px 30px rgba(12,30,58,.20)
}
.timeline{border-left:2px solid #d9e6e7;padding-left:15px;margin-top:13px}
.timeline-item{margin-bottom:17px}
.timeline-time{font-size:11px;color:#93a0b2}
.empty{text-align:center;padding:30px;color:#718096}
.bulkbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.bulkbar .count{font-size:12px;color:var(--muted);font-weight:650;margin-right:auto}
.bulkbar select{width:auto;min-width:160px}
.pagination{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;flex-wrap:wrap}
.pagination .pages{display:flex;align-items:center;gap:6px}
.pagination button{min-width:36px}
.pagination-info{font-size:12px;color:var(--muted)}
.row-check{width:18px;height:18px;cursor:pointer}
@media(max-width:900px){
  .metrics{grid-template-columns:repeat(2,1fr)}
  .two{grid-template-columns:1fr}
  aside{width:210px}
  main{margin-left:210px;width:calc(100% - 210px)}
}
@media(max-width:680px){
  #app{display:block}
  aside{position:static;width:100%;min-height:auto}
  main{margin:0;width:100%}
  header{padding:0 16px}
  .content,section#content{padding:16px}
  .metrics,.form-grid{grid-template-columns:1fr}
  .bottom{display:none}
  nav{display:flex;overflow:auto}
  nav button{white-space:nowrap}
  .filters>*{width:100%}
  .login-card{padding:28px 22px}
}


.nav-badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:22px;
  height:22px;
  padding:0 7px;
  margin-left:8px;
  border-radius:999px;
  background:#e5484d;
  color:#fff;
  font-size:11px;
  font-weight:800;
  line-height:1;
  vertical-align:middle;
  box-shadow:0 0 0 3px rgba(229,72,77,.10);
}
.nav-badge.pulse{
  animation:pendingPulse 1.8s ease-in-out infinite;
}
@keyframes pendingPulse{
  0%,100%{transform:scale(1);box-shadow:0 0 0 3px rgba(229,72,77,.10)}
  50%{transform:scale(1.08);box-shadow:0 0 0 7px rgba(229,72,77,.02)}
}

</style>
</head>
<body>
<div id="login" class="center screen">
  <div class="login-card">
    <div class="brand">OPD <span>Campaign CRM</span></div>
    <h1>Welcome Back</h1>
    <p class="muted">Sign in to your OPD Campaign CRM</p>
    <form id="loginForm">
      <label>Email<input id="email" type="email" required placeholder="Enter your email"></label>
      <label>Password<input id="password" type="password" required placeholder="Enter your password"></label>
      <button class="btn primary full" type="submit">Sign in →</button>
      <div id="loginError" class="error"></div>
    </form>
  </div>
</div>
<div id="app" class="hidden">
  <aside>
    <div class="brand">OPD <span>CRM</span></div>
    <nav id="nav"></nav>
    <div class="bottom"><div id="userInfo"></div><button id="logout" class="btn ghost">Sign out</button></div>
  </aside>
  <main>
    <header><div><b id="title">Dashboard</b><div id="subtitle" class="muted small"></div></div><div id="actions"></div></header>
    <section id="content"></section>
  </main>
</div>
<div id="modal" class="modal hidden"></div>
<div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
window.SUPABASE_CONFIG = {
  url: "https://tnijwzdckrdfxgjwcpii.supabase.co",
  anonKey: "sb_publishable_eGY4DVYL9bMSTqg5x-cVzA_lO3bRh-U",
  googleSyncUrl: "https://script.google.com/a/macros/even.in/s/AKfycbwS7v9ABMAkqhlXC3KtVZvlOYOJWaEbj_X5E_Roqju2Y8RSY6ND4IDwBZXwEF4klHb2/exec"
};
</script>
<script>
const {createClient}=supabase;
const C=window.SUPABASE_CONFIG||{};
const db=createClient(C.url,C.anonKey,{
  auth:{
    persistSession:true,
    autoRefreshToken:true,
    detectSessionInUrl:false,
    storage:window.localStorage,
    storageKey:'opd-crm-auth'
  }
});
const GOOGLE_SYNC_URL=C.googleSyncUrl||'';
const STATUS={not_called:'Not Called',connected:'Connected',dnp:'DNP',busy:'Busy',switched_off:'Switched Off',wrong_number:'Wrong Number',interested:'Interested',not_interested:'Not Interested',follow_up:'Follow-up',opd_booked:'OPD Booked',call_back:'Call Back Requested'};
const OPD={not_discussed:'Not Discussed',interested:'Interested',opd_recommended:'OPD Recommended',opd_booked:'OPD Booked',opd_completed:'OPD Completed',no_show:'No Show',cancelled:'Cancelled'};
let session=null,me=null,currentPage='dashboard',dbstate={campaigns:[],sources:[],callers:[],leads:[],sheetConnections:[],settings:{options:[],fields:[]},opdBookings:[],campaignHospitals:[]};
const DEFAULT_HOSPITALS=['EHRC','Altius'];
const APP_STATE_PREFIX='opd-crm-view-v3:';
function appStateKey(){return `${APP_STATE_PREFIX}${me?.id||'anonymous'}`;}
function readAppState(){try{return JSON.parse(localStorage.getItem(appStateKey())||'{}')||{};}catch(_){return {};}}
function writeAppState(patch={}){try{const prev=readAppState();localStorage.setItem(appStateKey(),JSON.stringify({...prev,...patch,ts:Date.now()}));}catch(_){}}
function validPageForRole(p){const allowed=me?.role==='admin'?['dashboard','leads','campaigns','import','sheets','export','users','settings']:['dashboard','leads','export'];return allowed.includes(p)?p:'dashboard';}

const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=x=>x?new Date(x+'T00:00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}):'';
const dt=x=>x?new Date(x).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'';
const toast=m=>{let t=$('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2200)};
const pill=s=>`<span class="pill ${['connected','opd_booked'].includes(s)?'success':s==='dnp'||s==='wrong_number'||s==='not_interested'?'danger':s==='follow_up'||s==='interested'?'warn':''}">${esc(settingLabel('calling_status',s,STATUS[s]||s))}</span>`;
async function start(){
  if(!C.url||C.url.includes('YOUR_PROJECT')){
    $('login').classList.remove('hidden');
    return;
  }

  try{
    const s=await db.auth.getSession();
    session=s.data?.session||null;

    if(!session){
      $('app').classList.add('hidden');
      $('login').classList.remove('hidden');
      return;
    }

    // A valid Supabase session is enough to keep the user in the app.
    // Profile/data loading errors must not force a re-login.
    await loadMeWithRetry();
    await loadAll();
    showApp();
  }catch(e){
    console.error('CRM startup/session restore failed:',e);
    if(session){
      // Keep the existing session visible when data loading has a transient failure.
      $('login').classList.add('hidden');
      $('app').classList.remove('hidden');
      if(me){showApp();toast('Some CRM data could not be loaded.');return;}
    }
    session=null;
    me=null;
    $('app').classList.add('hidden');
    $('login').classList.remove('hidden');
    const er=$('loginError');
    if(er) er.textContent=e?.message||'Unable to restore your session';
  }
}
db.auth.onAuthStateChange((event,newSession)=>{
  if(event==='SIGNED_OUT'){
    session=null;me=null;currentPage='dashboard';
    $('app').classList.add('hidden');
    $('login').classList.remove('hidden');
  }else if(newSession){
    session=newSession;
  }
});
setInterval(async()=>{
  if(session && me){
    try{await refreshLeadData({bookings:true});}catch(e){console.warn('Background refresh failed:',e)}
  }
},60000);
async function loadMe(){
  const r=await db.from('profiles').select('*').eq('id',session.user.id).single();
  if(r.error)throw r.error;
  me=r.data;
}
async function loadMeWithRetry(){
  let lastError=null;
  for(let i=0;i<3;i++){
    try{await loadMe();return;}catch(e){lastError=e;if(i<2)await new Promise(r=>setTimeout(r,350*(i+1)));}
  }
  throw lastError;
}
async function loadAll(){
  const metadataTasks=[
    db.from('campaigns').select('id,name,campaign_date,status,location,notes,coupon_code,created_by,created_at,updated_at').order('campaign_date',{ascending:false}),
    db.from('lead_sources').select('id,name,is_active,created_at').eq('is_active',true).order('name'),
    db.from('profiles').select('id,full_name,role,is_active,created_at').eq('is_active',true).order('full_name'),
    db.from('campaign_hospitals').select('id,campaign_id,hospital,is_active').eq('is_active',true).order('hospital'),
    db.from('crm_dropdown_options').select('id,category,label,sort_order,is_active').eq('is_active',true).order('category').order('sort_order').order('label'),
    db.from('lead_custom_fields').select('id,label,field_key,field_type,default_value,sort_order,is_active').eq('is_active',true).order('sort_order').order('label')
  ];
  if(me.role==='admin')metadataTasks.push(db.from('sheet_connections').select('*, source:lead_sources(name), campaign:campaigns(name,campaign_date)').order('created_at',{ascending:false}));

  const [campRes,srcRes,profRes,chRes,optRes,fieldRes,sheetRes]=await Promise.all([...metadataTasks,loadLeads()]);
  dbstate.campaigns=campRes.data||[];
  dbstate.sources=srcRes.data||[];
  dbstate.callers=(profRes.data||[]).filter(x=>x.role==='caller');
  dbstate.campaignHospitals=chRes.data||[];
  dbstate.settings={options:optRes.data||[],fields:fieldRes.data||[]};
  dbstate.sheetConnections=me.role==='admin'?(sheetRes?.data||[]):[];
  if(campRes.error)throw campRes.error;
  if(srcRes.error)throw srcRes.error;
  if(profRes.error)console.warn('Profiles load:',profRes.error.message);
  if(chRes.error)console.warn('Campaign hospitals load:',chRes.error.message);
  if(optRes.error)console.warn('Dropdown options load:',optRes.error.message);
  if(fieldRes.error)console.warn('Custom fields load:',fieldRes.error.message);
  if(me.role==='admin'&&sheetRes?.error)console.warn('Sheet connections load:',sheetRes.error.message);
  await loadBookings();
  refreshPendingBadge();
}
async function loadBookings(){
  try{
    const ids=dbstate.leads.map(l=>l.id);
    if(me.role!=='admin' && !ids.length){dbstate.opdBookings=[];return;}
    let q=db.from('opd_bookings').select('id,lead_id,campaign_id,booking_date,doctor_name,department,hospital_name,booking_status,notes,created_by,created_at,campaign:campaigns(name,campaign_date)').order('created_at',{ascending:false});
    if(me.role!=='admin')q=q.in('lead_id',ids);
    const br=await q;
    dbstate.opdBookings=br.data||[];
    if(br.error)console.warn('OPD bookings load:',br.error.message);
  }catch(e){dbstate.opdBookings=[];console.warn('OPD bookings unavailable:',e);}
}
async function loadLeads(){
  const pageSize=1000;
  const select='id,lead_number,patient_name,phone,alternate_phone,source_id,campaign_id,assigned_to,calling_status,opd_status,follow_up_date,follow_up_time,remarks,created_at,updated_at,normalized_phone,source_row_key,calling_date,visit,custom_data,is_referral,referred_by,hospital,coupon_code,campaign:campaigns(id,name,campaign_date),source:lead_sources(id,name),assignee:profiles!leads_assigned_to_fkey(id,full_name)';
  let all=[];
  for(let from=0;;from+=pageSize){
    let q=db.from('leads').select(select);
    if(me.role!=='admin')q=q.eq('assigned_to',me.id);
    const r=await q.order('created_at',{ascending:false}).order('id',{ascending:false}).range(from,from+pageSize-1);
    if(r.error)throw r.error;
    const rows=r.data||[];
    all.push(...rows);
    if(rows.length<pageSize)break;
  }
  dbstate.leads=all;
}
async function refreshLeadData({bookings=false}={}){
  await loadLeads();
  if(bookings)await loadBookings();
  refreshPendingBadge();
  if(currentPage==='leads'&&$('leadTable'))updateLeads();
  if(currentPage==='dashboard'&&$('dashBody'))renderDashboardBody();
}
function showApp(){
  $('login').classList.add('hidden');
  $('app').classList.remove('hidden');
  $('userInfo').textContent=`${me?.full_name||'User'} · ${me?.role||'user'}`;
  buildNav();
  const state=readAppState();
  currentPage=validPageForRole(state.page||'dashboard');
  if(state.leads){savedLeadFilterState=state.leads;}
  go(currentPage,{persist:false});
}
function getPendingCallCount(){
  if(!me) return 0;
  return dbstate.leads.filter(l=>l.assigned_to===me.id && l.calling_status==='not_called').length;
}
function refreshPendingBadge(){
  const b=$('pendingLeadBadge');
  const count=getPendingCallCount();
  if(b){
    b.textContent=count>999?'999+':String(count);
    b.style.display=count>0?'inline-flex':'none';
    b.classList.toggle('pulse',count>0);
    b.title=count>0?`${count} lead${count===1?'':'s'} waiting to be called`:'No pending leads';
  }
  if(me && me.role!=='admin'){
    document.title=count>0?`(${count}) OPD CRM`:'OPD CRM';
  }
}
function buildNav(){
  let pending=getPendingCallCount();
  let all=[['dashboard','📊 Dashboard'],['leads',`📋 Leads${me.role!=='admin'&&pending>0?`<span id="pendingLeadBadge" class="nav-badge pulse">${pending>999?'999+':pending}</span>`:`<span id="pendingLeadBadge" class="nav-badge" style="display:none"></span>`}`],['campaigns','📅 Campaigns'],['import','📥 Import'],['sheets','🔗 Google Sheets'],['export','📤 Export'],['users','👥 Users'],['settings','⚙️ Settings']];

let leadPage=1;

let savedLeadFilterState=null;

function captureLeadFilterState(){
  if(!$('q'))return;
  savedLeadFilterState={
    q:$('q').value,
    fc:$('fc').value,
    fs:$('fs').value,
    fh:$('fh').value,
    fa:$('fa').value,
    fst:$('fst').value,
    fopd:$('fopd').value,
    fvisit:$('fvisit').value,
    fcdfrom:$('fcdfrom').value,
    fcdto:$('fcdto').value,
    pageSize:$('pageSize')?.value||'100',
    page:leadPage
  };
}
function restoreLeadFilterState(){
  if(!savedLeadFilterState)return;
  const s=savedLeadFilterState;
  ['q','fc','fs','fh','fa','fst','fopd','fvisit','fcdfrom','fcdto'].forEach(id=>{if($(id)&&s[id]!==undefined)$(id).value=s[id]});

}
function clearLeadSelection(){leadSelected.clear();if($('selectAllPage'))$('selectAllPage').checked=false}
function getFilteredLeads(){
  let q=($('q')?.value||'').toLowerCase(),c=$('fc')?.value,s=$('fs')?.value,h=$('fh')?.value,a=$('fa')?.value,st=$('fst')?.value,opd=$('fopd')?.value,visit=$('fvisit')?.value,cdfrom=$('fcdfrom')?.value,cdto=$('fcdto')?.value;
  return dbstate.leads.filter(l=>{
    let callingDate=String(l.calling_date||'').slice(0,10);
    return (!q||(l.patient_name+' '+l.phone).toLowerCase().includes(q)) &&
      (!c||l.campaign_id===c) && (!s||l.source_id===s) &&
      (!h||String(l.hospital||'').trim().toLowerCase()===h.toLowerCase()) &&
      (!a||(a==='__unassigned__'?!l.assigned_to:l.assigned_to===a)) &&
      (!st||l.calling_status===st) && (!opd||l.opd_status===opd) &&
      (!visit||String(l.visit||'').trim().toLowerCase()===visit.toLowerCase()) &&
      (!cdfrom||callingDate>=cdfrom) && (!cdto||callingDate<=cdto);
  });
}

async function saveNewLead(){
  let name=$('npn').value.trim(),
      phone=$('nph').value.trim(),
      campaign_id=$('nc').value,
      source_id=$('ns').value,
      hospital=$('nh').value||null,
      coupon_code=$('ncc').value.trim()||null,
      is_referral=$('nReferral')?.value==='yes',
      referred_by=$('nReferredBy')?.value.trim()||null;

  if(!name||!phone||!campaign_id||!source_id)
    return toast('Name, phone, campaign and source are required');

  const normalizedPhone=phone.replace(/\D/g,'').slice(-10);
  if(normalizedPhone.length!==10)return toast('Enter a valid 10-digit phone number');

  const selectedCampaign=dbstate.campaigns.find(c=>c.id===campaign_id);
  const mappedHospitals=getCampaignHospitals(campaign_id);
  if(!hospital && mappedHospitals.length===1)hospital=mappedHospitals[0];
  if(!coupon_code)coupon_code=selectedCampaign?.coupon_code||null;

  let assigned=me.role==='admin'?($('na')?.value||null):me.id;
  const calling_status=$('nst').value;
  const opd_status=$('no').value;
  const follow_up_date=$('nfd').value||null;
  const follow_up_time=$('nft').value||null;
  const remarks=$('nr').value.trim()||null;

  // First inspect existing leads with the same phone in this campaign.
  const existingRes=await db.from('leads')
    .select('*, campaign:campaigns(name,campaign_date), source:lead_sources(name), assignee:profiles!leads_assigned_to_fkey(full_name)')
    .eq('campaign_id',campaign_id)
    .eq('normalized_phone',normalizedPhone);

  if(existingRes.error)return toast(existingRes.error.message);

  const existingLeads=existingRes.data||[];

  // Same number is allowed for multiple people (e.g. husband + wife).
  // Only treat it as a duplicate when the patient name is the same.
  const samePerson=existingLeads.find(x=>
    String(x.patient_name||'').trim().toLowerCase()===name.toLowerCase()
  );

  if(samePerson){
    openDuplicateLeadChoice(samePerson);
    return;
  }

  let leadId=null;

  // Direct insert keeps manual caller entry independent of any older RPC version.
  // The RLS policy limits callers to creating leads assigned to themselves.
  let custom_data={};
  (dbstate.settings.fields||[]).forEach(f=>{
    const el=$('ncf_'+f.field_key);
    if(el)custom_data[f.field_key]=el.value||null;
  });

  const ins=await db.from('leads').insert({
    patient_name:name, phone, source_id, campaign_id, assigned_to:assigned,
    calling_status, opd_status, follow_up_date, follow_up_time, remarks, hospital,
    coupon_code, is_referral, referred_by, custom_data
  }).select('id').single();

  if(ins.error){
    if(/duplicate|unique/i.test(ins.error.message||''))
      return toast('This phone number is already used for this campaign.');
    return toast(ins.error.message);
  }
  leadId=ins.data?.id||null;

  if(!leadId)return toast('Lead could not be created');

  const referralPatch={
    is_referral,
    referred_by,
    updated_at:new Date().toISOString()
  };
  const rr=await db.from('leads').update(referralPatch).eq('id',leadId);
  if(rr.error)return toast('Lead created, but referral details could not be saved: '+rr.error.message);

  if(assigned){
    const ar=await db.from('lead_assignments').insert({
      lead_id:leadId,
      assigned_to:assigned,
      assigned_by:me.id
    });
    if(ar.error)console.warn('Assignment history insert failed:',ar.error.message);
  }

  if(calling_status!=='not_called'){
    const cr=await db.from('call_logs').insert({
      lead_id:leadId,
      caller_id:me.id,
      calling_status,
      remarks
    });
    if(cr.error)console.warn('Call log insert failed:',cr.error.message);
  }

  if(calling_status==='follow_up'){
    const fr=await db.from('follow_ups').insert({
      lead_id:leadId,
      assigned_to:assigned||me.id,
      follow_up_date:follow_up_date||new Date().toISOString().slice(0,10),
      follow_up_time,
      notes:remarks
    });
    if(fr.error)console.warn('Follow-up insert failed:',fr.error.message);
  }

  await loadAll();
  closeModal();
  go('leads');
  toast(existingLeads.length
    ? `Lead added — shared phone number allowed for ${name}`
    : 'New lead added');
}

async function deleteCampaign(id){
  const c=dbstate.campaigns.find(x=>x.id===id);
  if(!c)return;
  const leadCount=dbstate.leads.filter(l=>l.campaign_id===id).length;
  const msg=leadCount
    ? `Delete campaign "${c.name}" and its ${leadCount} lead${leadCount===1?'':'s'}?\n\nThis will permanently delete the campaign, its leads, assignments, call logs, follow-ups and OPD booking records. This cannot be undone.`
    : `Delete campaign "${c.name}"?\n\nThis cannot be undone.`;
  if(!confirm(msg))return;
  const r=await db.rpc('delete_campaign', {p_campaign_id:id});
  if(r.error)return toast(r.error.message);
  await loadAll();
  renderCampaigns();
  toast(`Campaign "${c.name}" deleted`);
}

function csvRows(t){let out=[],row=[],cell='',q=false;for(let i=0;i<t.length;i++){let ch=t[i],nx=t[i+1];if(ch==='"'&&nx==='"'){cell+='"';i++;continue}if(ch==='"'){q=!q;continue}if(ch===','&&!q){row.push(cell);cell='';continue}if((ch==='\n'||ch==='\r')&&!q){if(ch==='\r'&&nx==='\n')i++;row.push(cell);if(row.some(v=>v.trim()))out.push(row);row=[];cell='';continue}cell+=ch}if(cell||row.length){row.push(cell);out.push(row)}return out}
async function importCSV(){let f=$('if').files[0],campaign_id=$('ic').value,source_id=$('is').value;if(!f||!campaign_id||!source_id)return toast('Choose campaign, source and CSV');let rows=csvRows(await f.text()),head=rows.shift().map(x=>x.trim().toLowerCase()),ni=head.indexOf('patient_name')>=0?head.indexOf('patient_name'):head.indexOf('name'),pi=head.indexOf('phone')>=0?head.indexOf('phone'):head.indexOf('mobile');if(ni<0||pi<0)return toast('CSV needs name and phone');let existing=new Set(dbstate.leads.map(l=>String(l.phone).replace(/\D/g,'').slice(-10))),ids=dbstate.callers.map(x=>x.id),added=0,dup=0,ci=0;for(let row of rows){let name=(row[ni]||'').trim(),phone=(row[pi]||'').replace(/\D/g,'');if(!name||!phone)continue;let key=phone.slice(-10);if(existing.has(key)){dup++;continue}existing.add(key);let assigned=$('ia').value==='round'?(ids[ci++%ids.length]||null):null;let r=await db.from('leads').insert({patient_name:name,phone,source_id,campaign_id,assigned_to:assigned});if(!r.error)added++}await loadLeads();toast(`Imported ${added} · duplicates skipped ${dup}`)}

async function saveSheetConnection(existingId=null){
  let p={
    name:$('scn').value.trim()||'Google Sheet',
    sheet_url:$('scurl').value.trim(),
    tab_name:$('sctab').value.trim()||'Sheet1',
    source_id:$('scsrc').value,
    campaign_id:$('sccamp').value,
    hospital:$('schospital').value||null,
    coupon_code:$('sccoupon').value.trim()||null,
    name_column:$('scname').value.trim()||null,
    phone_column:$('scphone').value.trim()||null
  };

  if(!p.sheet_url||!p.source_id||!p.campaign_id)
    return toast('Sheet URL, source and campaign are required');

  if(existingId){
    p.active=$('scactive')?.value!=='false';
    const dup=await db.from('sheet_connections')
      .select('id')
      .neq('id',existingId)
      .eq('sheet_url',p.sheet_url)
      .eq('tab_name',p.tab_name)
      .eq('source_id',p.source_id)
      .eq('campaign_id',p.campaign_id)
      .limit(1);
    if(dup.error)return toast(dup.error.message);
    if(dup.data?.length)return toast('Another connection already uses this Sheet tab, source and campaign');

    const r=await db.from('sheet_connections').update(p).eq('id',existingId);
    if(r.error)return toast(r.error.message);
    await loadAll();closeModal();renderSheets();toast('Google Sheet connection updated');
    return;
  }

  const dup=await db.from('sheet_connections')
    .select('id')
    .eq('sheet_url',p.sheet_url)
    .eq('tab_name',p.tab_name)
    .eq('source_id',p.source_id)
    .eq('campaign_id',p.campaign_id)
    .limit(1);
  if(dup.error)return toast(dup.error.message);
  if(dup.data?.length)return toast('This Sheet tab is already connected to this source and campaign');

  p.created_by=me.id;
  p.active=true;

  let r=await db.from('sheet_connections').insert(p).select().single();
  if(r.error)return toast(r.error.message);
  await loadAll();closeModal();renderSheets();toast('Google Sheet connected. New leads will sync automatically');
}
async function syncSheetNow(id){if(!GOOGLE_SYNC_URL)return toast('Set googleSyncUrl first');try{let r=await fetch(GOOGLE_SYNC_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'sync',connection_id:id})});let t=await r.text();let j={};try{j=JSON.parse(t)}catch(_){};if(!r.ok||j.ok===false)return toast(j.error||j.message||('Sync failed (HTTP '+r.status+')'));toast(j.message||('Sync complete: '+(j.inserted??0)+' inserted'));setTimeout(async()=>{await loadAll();renderSheets()},800)}catch(e){toast('Sync request failed: '+(e.message||e))}}
function renderExport(){if(me.role!=='admin'){ $('content').innerHTML='<div class="notice">Export is available to Admin only.</div>';return}$('content').innerHTML=`<div class="panel" style="margin-top:0"><div class="form-grid"><label>Campaign<select id="ec"><option value="">All campaigns</option>${uniqueCampaigns().map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></label><label>Source<select id="es"><option value="">All sources</option>${dbstate.sources.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></label><label>Assigned To<select id="ea"><option value="">All callers</option><option value="__unassigned__">Unassigned</option>${dbstate.callers.map(u=>`<option value="${u.id}">${esc(u.full_name)}</option>`).join('')}</select></label><label>Calling Status<select id="est"><option value="">All calling statuses</option>${Object.entries(STATUS).filter(([k])=>k!=='opd_booked').map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label><label>OPD Status<select id="eopd"><option value="">All OPD statuses</option>${Object.entries(OPD).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label><label>Campaign Date From<input id="edfrom" type="date"></label><label>Campaign Date To<input id="edto" type="date"></label></div><div class="modal-actions"><button class="btn secondary" id="ep">Preview Count</button><button class="btn primary" id="ex">Export CSV</button></div><div id="ecount" style="margin-top:14px"></div></div>`;$('ep').onclick=previewExport;$('ex').onclick=doExport}
function filtered(){let c=$('ec').value,s=$('es').value,a=$('ea').value,st=$('est').value,opd=$('eopd').value,df=$('edfrom').value,dt=$('edto').value;if(df&&dt&&df>dt){$('ecount').innerHTML='<div class="notice" style="background:#fff0f2;color:#b42335;border-color:#f5cbd1">From date cannot be after To date.</div>';return []}return dbstate.leads.filter(l=>{let cd=l.campaign?.campaign_date||'';return (!c||l.campaign_id===c)&&(!s||l.source_id===s)&&(!a||(a==='__unassigned__'?!l.assigned_to:l.assigned_to===a))&&(!st||l.calling_status===st)&&(!opd||l.opd_status===opd)&&(!df||cd>=df)&&(!dt||cd<=dt)})}
function previewExport(){let x=filtered();if($('edfrom').value&&$('edto').value&&$('edfrom').value>$('edto').value)return;$('ecount').innerHTML=`<div class="notice">${x.length} lead${x.length===1?'':'s'} match the selected filters.</div>`}
function doExport(){let x=filtered();if($('edfrom').value&&$('edto').value&&$('edfrom').value>$('edto').value)return;if(!x.length)return toast('No leads match');let rows=[['Lead #','Patient Name','Phone','Source','Campaign','Campaign Date','Hospital','Assigned To','Calling Date','Calling Status','Follow-up Date','OPD Status','Visit','Remarks'],...x.map(l=>[l.lead_number,l.patient_name,l.phone,l.source?.name,l.campaign?.name,l.campaign?.campaign_date,l.hospital||'',l.assignee?.full_name||'',l.calling_date||'',STATUS[l.calling_status],l.follow_up_date,OPD[l.opd_status],l.visit||'',l.remarks||''])];let csv=rows.map(r=>r.map(v=>`"${String(v??'').replaceAll('"','""')}"`).join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='OPD_CRM_Export.csv';a.click();toast(`Exported ${x.length} leads`)}
function renderUsers(){if(me.role!=='admin')return;$('content').innerHTML=`<div class="panel" style="margin-top:0"><div class="notice">Create users under Supabase Authentication → Users. The schema trigger creates their profile. Promote one profile to Admin using the SQL comment in <b>supabase/schema.sql</b>.</div><div class="table-wrap" style="margin-top:16px"><table><thead><tr><th>Name</th><th>Role</th><th>Status</th></tr></thead><tbody>${[me,...dbstate.callers.filter(x=>x.id!==me.id)].map(u=>`<tr><td>${esc(u.full_name)}</td><td>${esc(u.role)}</td><td>${u.is_active?'Active':'Disabled'}</td></tr>`).join('')}</tbody></table></div></div>`}
$('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();
  $('loginError').textContent='';
  const btn=$('loginForm').querySelector('button[type="submit"]');
  if(btn){btn.disabled=true;btn.textContent='Signing in…';}

  try{
    const r=await db.auth.signInWithPassword({
      email:$('email').value.trim(),
      password:$('password').value
    });

    if(r.error){
      $('loginError').textContent=r.error.message;
      return;
    }

    session=r.data.session;
    await loadMeWithRetry();

    try{
      await loadAll();
    }catch(dataErr){
      console.error('Post-login data load failed:',dataErr);
      toast('Login successful. Some CRM data could not be loaded.');
    }

    showApp();
  }catch(err){
    console.error('Login failed:',err);
    $('loginError').textContent=err?.message||'Unable to sign in';
  }finally{
    if(btn){btn.disabled=false;btn.textContent='Sign in →';}
  }
});
$('logout').onclick=async()=>{await db.auth.signOut();currentPage='dashboard';};
start().catch(e=>{
  console.error(e);
  $('app').classList.add('hidden');
  $('login').classList.remove('hidden');
  $('loginError').textContent=e?.message||'Unable to start CRM';
});

window.addEventListener('beforeunload',()=>{
  if(!me)return;
  try{
    const p=currentPage;
    if(p==='leads'&&$('q')){
      writeAppState({page:'leads',leads:{q:$('q').value,fc:$('fc').value,fs:$('fs').value,fh:$('fh').value,fa:$('fa').value,fst:$('fst').value,fopd:$('fopd').value,fvisit:$('fvisit').value,fcdfrom:$('fcdfrom').value,fcdto:$('fcdto').value,pageSize:$('pageSize').value,page:leadPage}});
    }else{
      writeAppState({page:p});
    }
  }catch(_){}
});
