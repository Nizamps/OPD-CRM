<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OPD Campaign CRM</title>
<style>
*{box-sizing:border-box}
:root{
  --navy:#12264a;
  --navy-2:#19335e;
  --teal:#21a89b;
  --teal-dark:#138f86;
  --teal-soft:#e9f8f6;
  --text:#1d2b45;
  --muted:#65748d;
  --border:#d8e1ec;
  --bg:#f4f8fa;
  --white:#fff;
  --shadow:0 24px 70px rgba(18,38,74,.10);
}
html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.center{min-height:100vh;display:grid;place-items:center;padding:0}
.screen{min-height:100vh}
.login-card{
  width:min(440px,calc(100vw - 34px));
  background:rgba(255,255,255,.96);
  border:1px solid rgba(255,255,255,.8);
  border-radius:24px;
  padding:38px;
  box-shadow:var(--shadow);
  backdrop-filter:blur(12px);
}
.login-card:before{
  content:"";
  display:block;
  width:52px;
  height:52px;
  border-radius:16px;
  margin-bottom:20px;
  background:linear-gradient(135deg,#2bb8aa,#0c8f86);
  box-shadow:0 10px 22px rgba(33,168,155,.20);
}
.brand{
  font-size:22px;
  font-weight:800;
  letter-spacing:-.5px;
  margin-bottom:8px;
  color:var(--navy);
}
.brand span{color:var(--teal)}
.login-card h1{
  font-size:30px;
  line-height:1.15;
  letter-spacing:-.7px;
  margin:12px 0 7px;
  color:var(--navy);
}
.login-card form{display:grid;gap:16px;margin-top:25px}
label{display:grid;gap:7px;font-size:13px;font-weight:650;color:var(--navy)}
input,select,textarea{
  width:100%;
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px 13px;
  background:#fff;
  color:var(--text);
  transition:border-color .18s,box-shadow .18s,transform .18s;
}
input::placeholder,textarea::placeholder{color:#96a3b5}
input:focus,select:focus,textarea:focus{
  outline:0;
  border-color:#75c9c1;
  box-shadow:0 0 0 4px rgba(33,168,155,.11);
}
textarea{min-height:90px}
.btn{
  border:0;
  border-radius:11px;
  padding:11px 15px;
  font-weight:700;
  transition:transform .15s,box-shadow .15s,background .15s;
}
.btn:hover{transform:translateY(-1px)}
.btn.primary{
  background:linear-gradient(135deg,var(--teal),var(--teal-dark));
  color:#fff;
  box-shadow:0 10px 24px rgba(33,168,155,.20);
}
.btn.primary:hover{box-shadow:0 14px 28px rgba(33,168,155,.26)}
.btn.secondary{background:#edf3f7;color:#334b68}
.btn.ghost{background:transparent;color:#cbd5e1;border:1px solid #33445e}
.error{min-height:18px;color:#b91c1c;font-size:12px}
.muted{color:var(--muted)}
.small{font-size:12px}
.full{width:100%}

#loginView{
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 72% 7%,rgba(88,201,190,.15),transparent 26%),
    radial-gradient(circle at 7% 90%,rgba(93,137,218,.11),transparent 25%),
    linear-gradient(135deg,#f8fcfd 0%,#eef6f8 100%);
}
#loginView:after{
  content:"";
  position:absolute;
  left:50%;
  bottom:-140px;
  width:620px;
  height:270px;
  border-radius:50% 50% 0 0;
  background:linear-gradient(135deg,rgba(42,183,171,.78),rgba(24,151,141,.93));
  transform:translateX(-20%) rotate(-11deg);
  opacity:.80;
}
#loginView .login-card{position:relative;z-index:2}

#app{min-height:100vh;display:flex;background:#f4f7fa}
aside{
  position:fixed;
  inset:0 auto 0 0;
  width:248px;
  background:linear-gradient(180deg,#102343 0%,#0d1d37 100%);
  color:#fff;
  padding:22px 15px;
  display:flex;
  flex-direction:column;
  box-shadow:10px 0 34px rgba(18,38,74,.08);
}
aside .brand{padding:4px 10px 22px;color:#fff}
aside .brand:after{
  content:"Campaign lead management";
  display:block;
  color:#8292aa;
  font-size:10px;
  font-weight:500;
  letter-spacing:.2px;
  margin-top:5px;
}
aside .brand span{color:#43c4b6}
nav{display:grid;gap:5px}
nav button{
  background:transparent;
  border:0;
  color:#b9c6d9;
  text-align:left;
  padding:12px 13px;
  border-radius:10px;
  font-size:13px;
  font-weight:600;
}
nav button.active,nav button:hover{background:rgba(255,255,255,.08);color:#fff}
nav button.active{box-shadow:inset 3px 0 0 #39b9ae}
.bottom{
  margin-top:auto;
  display:grid;
  gap:10px;
  font-size:12px;
  color:#cbd5e1;
  padding:10px;
}
main{margin-left:248px;width:calc(100% - 248px)}
header{
  height:76px;
  background:rgba(255,255,255,.92);
  border-bottom:1px solid #e6ebf0;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 30px;
  position:sticky;
  top:0;
  z-index:10;
  backdrop-filter:blur(10px);
}
.page-title{font-size:21px;font-weight:800;color:var(--navy);letter-spacing:-.3px}
.content,section#content{padding:28px}
.grid{display:grid;gap:17px}
.metrics{grid-template-columns:repeat(4,1fr)}
.two{grid-template-columns:repeat(2,1fr)}
.card,.panel{
  background:rgba(255,255,255,.94);
  border:1px solid #e5eaf0;
  border-radius:16px;
  box-shadow:0 8px 24px rgba(15,23,42,.04);
}
.card{padding:20px}
.panel{padding:20px;margin-top:18px}
.metric-label{font-size:12px;color:#748196;font-weight:650}
.metric{font-size:30px;font-weight:850;margin-top:6px;color:var(--navy)}
.panel-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px
}
.section-title{margin:0;font-size:16px;color:var(--navy)}
.filters{display:flex;gap:9px;flex-wrap:wrap}
.filters>*{width:auto;min-width:150px}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:12px 10px;text-align:left;border-bottom:1px solid #edf1f4;white-space:nowrap}
th{color:#738198;background:#fafbfd;font-weight:700}
tr:hover td{background:#fcfefe}
.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#edf2ff;color:#3f46a4;font-size:11px;font-weight:700}
.success{background:#eaf9f6;color:#087a6f}
.warn{background:#fff5e9;color:#b75f0c}
.danger{background:#fff0f2;color:#b42335}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.notice{
  padding:13px 15px;
  border-radius:11px;
  background:#edf9f7;
  color:#087d73;
  font-size:13px;
  border:1px solid #d4f0ec;
}
.modal{
  position:fixed;
  inset:0;
  background:rgba(10,25,47,.54);
  display:grid;
  place-items:center;
  padding:20px;
  z-index:20;
  backdrop-filter:blur(3px);
}
.modal-box{
  background:#fff;
  width:min(780px,100%);
  max-height:90vh;
  overflow:auto;
  border-radius:18px;
  padding:24px;
  box-shadow:0 30px 80px rgba(12,30,58,.22)
}
.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}
.toast{
  position:fixed;
  right:22px;
  bottom:22px;
  background:#11233f;
  color:#fff;
  padding:12px 16px;
  border-radius:10px;
  display:none;
  z-index:30;
  box-shadow:0 12px 30px rgba(12,30,58,.20)
}
.timeline{border-left:2px solid #d9e6e7;padding-left:15px;margin-top:13px}
.timeline-item{margin-bottom:17px}
.timeline-time{font-size:11px;color:#93a0b2}
.empty{text-align:center;padding:30px;color:#718096}
.bulkbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.bulkbar .count{font-size:12px;color:var(--muted);font-weight:650;margin-right:auto}
.bulkbar select{width:auto;min-width:160px}
.pagination{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;flex-wrap:wrap}
.pagination .pages{display:flex;align-items:center;gap:6px}
.pagination button{min-width:36px}
.pagination-info{font-size:12px;color:var(--muted)}
.row-check{width:18px;height:18px;cursor:pointer}
@media(max-width:900px){
  .metrics{grid-template-columns:repeat(2,1fr)}
  .two{grid-template-columns:1fr}
  aside{width:210px}
  main{margin-left:210px;width:calc(100% - 210px)}
}
@media(max-width:680px){
  #app{display:block}
  aside{position:static;width:100%;min-height:auto}
  main{margin:0;width:100%}
  header{padding:0 16px}
  .content,section#content{padding:16px}
  .metrics,.form-grid{grid-template-columns:1fr}
  .bottom{display:none}
  nav{display:flex;overflow:auto}
  nav button{white-space:nowrap}
  .filters>*{width:100%}
  .login-card{padding:28px 22px}
}

</style>
</head>
<body>
<div id="login" class="center screen">
  <div class="login-card">
    <div class="brand">OPD <span>Campaign CRM</span></div>
    <h1>Welcome Back</h1>
    <p class="muted">Sign in to your OPD Campaign CRM</p>
    <form id="loginForm">
      <label>Email<input id="email" type="email" required placeholder="Enter your email"></label>
      <label>Password<input id="password" type="password" required placeholder="Enter your password"></label>
      <button class="btn primary full" type="submit">Sign in →</button>
      <div id="loginError" class="error"></div>
    </form>
  </div>
</div>
<div id="app" class="hidden">
  <aside>
    <div class="brand">OPD <span>CRM</span></div>
    <nav id="nav"></nav>
    <div class="bottom"><div id="userInfo"></div><button id="logout" class="btn ghost">Sign out</button></div>
  </aside>
  <main>
    <header><div><b id="title">Dashboard</b><div id="subtitle" class="muted small"></div></div><div id="actions"></div></header>
    <section id="content"></section>
  </main>
</div>
<div id="modal" class="modal hidden"></div>
<div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
window.SUPABASE_CONFIG = {
  url: "https://tnijwzdckrdfxgjwcpii.supabase.co",
  anonKey: "sb_publishable_eGY4DVYL9bMSTqg5x-cVzA_lO3bRh-U",
  googleSyncUrl: "https://script.google.com/a/macros/even.in/s/AKfycbwS7v9ABMAkqhlXC3KtVZvlOYOJWaEbj_X5E_Roqju2Y8RSY6ND4IDwBZXwEF4klHb2/exec"
};
</script>
<script>
const {createClient}=supabase;
const C=window.SUPABASE_CONFIG||{};
const db=createClient(C.url,C.anonKey);
const GOOGLE_SYNC_URL=C.googleSyncUrl||'';
const STATUS={not_called:'Not Called',connected:'Connected',dnp:'DNP',busy:'Busy',switched_off:'Switched Off',wrong_number:'Wrong Number',interested:'Interested',not_interested:'Not Interested',follow_up:'Follow-up',opd_booked:'OPD Booked',call_back:'Call Back Requested'};
const OPD={not_discussed:'Not Discussed',interested:'Interested',opd_recommended:'OPD Recommended',opd_booked:'OPD Booked',opd_completed:'OPD Completed',no_show:'No Show',cancelled:'Cancelled'};
let session=null,me=null,dbstate={campaigns:[],sources:[],callers:[],leads:[],sheetConnections:[]};
const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=x=>x?new Date(x+'T00:00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}):'';
const dt=x=>x?new Date(x).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'';
const toast=m=>{let t=$('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2200)};
const pill=s=>`<span class="pill ${['connected','opd_booked'].includes(s)?'success':s==='dnp'||s==='wrong_number'||s==='not_interested'?'danger':s==='follow_up'||s==='interested'?'warn':''}">${esc(STATUS[s]||s)}</span>`;
async function start(){if(!C.url||C.url.includes('YOUR_PROJECT')){ $('login').innerHTML='<div class="login-card"><div class="brand">OPD <span>Campaign CRM</span></div><h1>Configure Supabase</h1><p class="muted">Edit the <b>SUPABASE_CONFIG</b> block near the top of this file with your project URL and Publishable/anon key.</p><div class="notice">Never use a sb_secret or service-role key in this GitHub site.</div></div>';return}const s=await db.auth.getSession();session=s.data.session;if(session){await loadMe();await loadAll();showApp()}else $('login').classList.remove('hidden')}
async function loadMe(){const r=await db.from('profiles').select('*').eq('id',session.user.id).single();if(r.error)throw r.error;me=r.data}
async function loadAll(){let qs=[db.from('campaigns').select('*').order('campaign_date',{ascending:false}),db.from('lead_sources').select('*').eq('is_active',true).order('name'),db.from('profiles').select('*').eq('is_active',true).order('full_name')];if(me.role==='admin')qs.push(db.from('sheet_connections').select('*, source:lead_sources(name), campaign:campaigns(name,campaign_date)').order('created_at',{ascending:false}));let r=await Promise.all(qs);dbstate.campaigns=r[0].data||[];dbstate.sources=r[1].data||[];dbstate.callers=(r[2].data||[]).filter(x=>x.role==='caller');dbstate.sheetConnections=(me.role==='admin'?(r[3]?.data||[]):[]);await loadLeads()}
async function loadLeads(){
  const pageSize=1000;
  let all=[];
  for(let from=0;;from+=pageSize){
    let q=db.from('leads').select('*, campaign:campaigns(name,campaign_date), source:lead_sources(name), assignee:profiles!leads_assigned_to_fkey(full_name)');
    if(me.role!=='admin')q=q.eq('assigned_to',me.id);
    let r=await q.order('created_at',{ascending:false}).order('id',{ascending:false}).range(from,from+pageSize-1);
    if(r.error)throw r.error;
    const rows=r.data||[];
    all.push(...rows);
    if(rows.length<pageSize)break;
  }
  dbstate.leads=all;
}
function showApp(){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('userInfo').textContent=`${me.full_name} · ${me.role}`;buildNav();go('dashboard')}
function buildNav(){let all=[['dashboard','📊 Dashboard'],['leads','📋 Leads'],['campaigns','📅 Campaigns'],['import','📥 Import'],['sheets','🔗 Google Sheets'],['export','📤 Export'],['users','👥 Users']];$('nav').innerHTML=all.filter(x=>me.role==='admin'||['dashboard','leads','export'].includes(x[0])).map(x=>`<button data-page="${x[0]}">${x[1]}</button>`).join('');document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.page))}
function go(p){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));let meta={dashboard:['Dashboard','Campaign and calling performance'],leads:['Leads','Work your calling queue'],campaigns:['Campaigns','Create and manage weekend campaigns'],import:['Import','Bring leads into a campaign'],sheets:['Google Sheets','Connect live lead sources'],export:['Export','Download filtered lead data'],users:['Users','Manage CRM access']}[p];$('title').textContent=meta[0];$('subtitle').textContent=meta[1];$('actions').innerHTML='';({dashboard:renderDash,leads:renderLeads,campaigns:renderCampaigns,import:renderImport,sheets:renderSheets,export:renderExport,users:renderUsers}[p]||renderDash)()}
function renderDash(){let l=dbstate.leads,n=l.length;let m=[['Total Leads',n],['Assigned',l.filter(x=>x.assigned_to).length],['Called',l.filter(x=>x.calling_status!=='not_called').length],['Pending',l.filter(x=>x.calling_status==='not_called').length],['Connected',l.filter(x=>x.calling_status==='connected').length],['DNP',l.filter(x=>x.calling_status==='dnp').length],['Follow-up',l.filter(x=>x.calling_status==='follow_up').length],['OPD Booked',l.filter(x=>x.opd_status==='opd_booked').length]];$('content').innerHTML=`<div class="notice">${dbstate.campaigns[0]?`Latest campaign: <b>${esc(dbstate.campaigns[0].name)}</b> · ${date(dbstate.campaigns[0].campaign_date)}`:'Create your first weekend campaign from Campaigns.'}</div><div class="grid metrics" style="margin-top:17px">${m.map(x=>`<div class="card"><div class="metric-label">${x[0]}</div><div class="metric">${x[1]}</div></div>`).join('')}</div><div class="grid two"><div class="panel"><div class="panel-head"><b>Caller Performance</b></div>${me.role==='admin'?callerPerf():myPerf()}</div><div class="panel"><div class="panel-head"><b>Lead Sources</b></div>${sourcePerf()}</div></div>`}
function callerPerf(){return `<div class="table-wrap"><table><thead><tr><th>Caller</th><th>Assigned</th><th>Called</th><th>Connected</th><th>OPD</th></tr></thead><tbody>${dbstate.callers.map(u=>{let x=dbstate.leads.filter(l=>l.assigned_to===u.id);return `<tr><td>${esc(u.full_name)}</td><td>${x.length}</td><td>${x.filter(l=>l.calling_status!=='not_called').length}</td><td>${x.filter(l=>l.calling_status==='connected').length}</td><td>${x.filter(l=>l.opd_status==='opd_booked').length}</td></tr>`}).join('')}</tbody></table></div>`}
function myPerf(){let l=dbstate.leads;return [['My Leads',l.length],['Pending',l.filter(x=>x.calling_status==='not_called').length],['Follow-ups',l.filter(x=>x.calling_status==='follow_up').length],['OPD Booked',l.filter(x=>x.opd_status==='opd_booked').length]].map(x=>`<div style="display:flex;justify-content:space-between;margin:12px 0;font-size:13px"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}
function sourcePerf(){return `<div class="table-wrap"><table><thead><tr><th>Source</th><th>Leads</th><th>Called</th><th>OPD</th></tr></thead><tbody>${dbstate.sources.map(s=>{let x=dbstate.leads.filter(l=>l.source_id===s.id);return `<tr><td>${esc(s.name)}</td><td>${x.length}</td><td>${x.filter(l=>l.calling_status!=='not_called').length}</td><td>${x.filter(l=>l.opd_status==='opd_booked').length}</td></tr>`}).join('')}</tbody></table></div>`}
function renderLeads(){
  $('actions').innerHTML='<button class="btn primary" id="newLead">+ Add New Lead</button>';
  $('content').innerHTML=`<div class="panel" style="margin-top:0"><div class="filters"><input id="q" placeholder="Search name / phone"><select id="fc"><option value="">All campaigns</option>${dbstate.campaigns.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select><select id="fs"><option value="">All sources</option>${dbstate.sources.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select><select id="fa"><option value="">All callers</option><option value="__unassigned__">Unassigned</option>${dbstate.callers.map(u=>`<option value="${u.id}">${esc(u.full_name)}</option>`).join('')}</select><select id="fst"><option value="">All calling statuses</option>${Object.entries(STATUS).filter(([k])=>k!=='opd_booked').map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><select id="fopd"><option value="">All OPD statuses</option>${Object.entries(OPD).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div></div><div class="panel"><div class="bulkbar"><label style="display:flex;align-items:center;gap:8px;width:auto;min-width:0"><input id="selectAllPage" class="row-check" type="checkbox"> Select page</label><span id="selectedCount" class="count">0 selected</span>${me.role==='admin'?`<select id="bulkAssignee"><option value="">Assign selected to...</option><option value="__unassigned__">Unassign selected</option>${dbstate.callers.map(u=>`<option value="${u.id}">${esc(u.full_name)}</option>`).join('')}</select><button class="btn primary" id="bulkAssign">Assign</button>`:''}<label style="display:flex;align-items:center;gap:7px;width:auto;min-width:0">Rows <select id="pageSize"><option value="25">25</option><option value="50">50</option><option value="100" selected>100</option><option value="200">200</option></select></label></div><div id="leadCount" class="small muted" style="margin-bottom:12px"></div><div id="leadTable"></div><div id="pagination"></div></div>`;

  ['q','fc','fs','fa','fst','fopd'].forEach(id=>$(id).addEventListener('input',()=>{leadPage=1;clearLeadSelection();updateLeads()}));
  $('pageSize').addEventListener('change',()=>{leadPage=1;clearLeadSelection();updateLeads()});
  $('newLead').onclick=()=>openNewLead();
  $('selectAllPage').addEventListener('change',toggleSelectAllPage);
  if(me.role==='admin')$('bulkAssign').onclick=bulkAssignSelected;
  updateLeads();
}

let leadPage=1;
let leadSelected=new Set();

function clearLeadSelection(){
  leadSelected.clear();
  if($('selectAllPage'))$('selectAllPage').checked=false;
}

function getFilteredLeads(){
  let q=($('q')?.value||'').toLowerCase(),c=$('fc')?.value,s=$('fs')?.value,a=$('fa')?.value,st=$('fst')?.value,opd=$('fopd')?.value;
  return dbstate.leads.filter(l=>
    (!q||(l.patient_name+' '+l.phone).toLowerCase().includes(q)) &&
    (!c||l.campaign_id===c) &&
    (!s||l.source_id===s) &&
    (!a||(a==='__unassigned__'?!l.assigned_to:l.assigned_to===a)) &&
    (!st||l.calling_status===st) &&
    (!opd||l.opd_status===opd)
  );
}

function updateSelectedCount(){
  if($('selectedCount'))$('selectedCount').textContent=`${leadSelected.size} selected`;
}

function toggleLeadSelection(id,checked){
  if(checked)leadSelected.add(id);else leadSelected.delete(id);
  updateSelectedCount();
  syncSelectAllPage();
}

function toggleSelectAllPage(){

function csvRows(t){let out=[],row=[],cell='',q=false;for(let i=0;i<t.length;i++){let ch=t[i],nx=t[i+1];if(ch==='"'&&nx==='"'){cell+='"';i++;continue}if(ch==='"'){q=!q;continue}if(ch===','&&!q){row.push(cell);cell='';continue}if((ch==='\n'||ch==='\r')&&!q){if(ch==='\r'&&nx==='\n')i++;row.push(cell);if(row.some(v=>v.trim()))out.push(row);row=[];cell='';continue}cell+=ch}if(cell||row.length){row.push(cell);out.push(row)}return out}

async function syncSheetNow(id){if(!GOOGLE_SYNC_URL)return toast('Set googleSyncUrl first');try{let r=await fetch(GOOGLE_SYNC_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'sync',connection_id:id})});let t=await r.text();let j={};try{j=JSON.parse(t)}catch(_){};toast(j.message||'Sync requested');setTimeout(async()=>{await loadAll();renderSheets()},1500)}catch(e){toast('Sync request failed')}}
function renderExport(){if(me.role!=='admin'){ $('content').innerHTML='<div class="notice">Export is available to Admin only.</div>';return}$('content').innerHTML=`<div class="panel" style="margin-top:0"><div class="form-grid"><label>Campaign<select id="ec"><option value="">All campaigns</option>${dbstate.campaigns.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></label><label>Source<select id="es"><option value="">All sources</option>${dbstate.sources.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></label><label>Assigned To<select id="ea"><option value="">All callers</option>${dbstate.callers.map(u=>`<option value="${u.id}">${esc(u.full_name)}</option>`).join('')}</select></label><label>Status<select id="est"><option value="">All statuses</option>${Object.entries(STATUS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label></div><div class="modal-actions"><button class="btn secondary" id="ep">Preview Count</button><button class="btn primary" id="ex">Export CSV</button></div><div id="ecount" style="margin-top:14px"></div></div>`;$('ep').onclick=previewExport;$('ex').onclick=doExport}
function filtered(){let c=$('ec').value,s=$('es').value,a=$('ea').value,st=$('est').value;return dbstate.leads.filter(l=>(!c||l.campaign_id===c)&&(!s||l.source_id===s)&&(!a||l.assigned_to===a)&&(!st||l.calling_status===st))}
function previewExport(){$('ecount').innerHTML=`<div class="notice">${filtered().length} leads match the selected filters.</div>`}
function doExport(){let x=filtered();if(!x.length)return toast('No leads match');let rows=[['Lead #','Patient Name','Phone','Source','Campaign','Campaign Date','Assigned To','Calling Status','Follow-up Date','OPD Status','Remarks'],...x.map(l=>[l.lead_number,l.patient_name,l.phone,l.source?.name,l.campaign?.name,l.campaign?.campaign_date,l.assignee?.full_name||'',STATUS[l.calling_status],l.follow_up_date,OPD[l.opd_status],l.remarks||''])];let csv=rows.map(r=>r.map(v=>`"${String(v??'').replaceAll('"','""')}"`).join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='OPD_CRM_Export.csv';a.click();toast(`Exported ${x.length} leads`)}
function renderUsers(){if(me.role!=='admin')return;$('content').innerHTML=`<div class="panel" style="margin-top:0"><div class="notice">Create users under Supabase Authentication → Users. The schema trigger creates their profile. Promote one profile to Admin using the SQL comment in <b>supabase/schema.sql</b>.</div><div class="table-wrap" style="margin-top:16px"><table><thead><tr><th>Name</th><th>Role</th><th>Status</th></tr></thead><tbody>${[me,...dbstate.callers.filter(x=>x.id!==me.id)].map(u=>`<tr><td>${esc(u.full_name)}</td><td>${esc(u.role)}</td><td>${u.is_active?'Active':'Disabled'}</td></tr>`).join('')}</tbody></table></div></div>`}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginError').textContent='';let r=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(r.error){$('loginError').textContent=r.error.message;return}session=r.data.session;await loadMe();await loadAll();showApp()});
$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};
start().catch(e=>{console.error(e);$('loginError').textContent=e.message||'Unable to start CRM'});

</script>
